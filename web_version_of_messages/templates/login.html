{% extends "base.html" %}

{% block title %}登录 - 漂流瓶{% endblock %}

{% block content %}
<div class="login-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="card login-card floating-animation">
                    <div class="card-header login-header text-center">
                        <h3><i class="fas fa-sign-in-alt"></i> 用户登录</h3>
                        <p class="mb-0">欢迎回到漂流瓶</p>
                    </div>
                    <div class="card-body login-body">
                        <form method="POST">
                            <div class="mb-4">
                                <label for="username" class="form-label">用户名</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                                    <input type="text" class="form-control" id="username" name="username" placeholder="请输入用户名" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label">密码</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码" required>
                                </div>
                            </div>
                            <div class="d-grid gap-3">
                                <button type="submit" class="btn btn-login btn-lg">登录</button>
                                <a href="{{ url_for('register') }}" class="btn btn-outline-primary">没有账号？立即注册</a>
                            </div>
                        </form>
                        
                        <div class="text-center mt-4">
                            <small class="text-muted">
                                <i class="fas fa-info-circle"></i> 登录后即可享受漂流瓶的全部功能
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // 添加回车键登录功能
    $(document).ready(function() {
        $('#password').keypress(function(e) {
            if (e.which == 13) {
                $('form').submit();
            }
        });
    });
</script>
{% endblock %}
