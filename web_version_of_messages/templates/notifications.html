{% extends "base.html" %}

{% block title %}通知中心 - 漂流瓶{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="fas fa-bell"></i> 通知中心
                        {% if unread_count > 0 %}
                        <span class="badge bg-danger ms-2">{{ unread_count }}</span>
                        {% endif %}
                    </h4>
                </div>
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <button class="btn btn-sm btn-outline-primary" id="refresh-notifications">
                                <i class="fas fa-sync-alt"></i> 刷新
                            </button>
                        </div>
                        <div>
                            <button class="btn btn-sm btn-outline-success" id="mark-all-read">
                                <i class="fas fa-check-double"></i> 全部标记为已读
                            </button>
                        </div>
                    </div>
                    
                    <div id="notifications-container">
                        <!-- 通知内容将通过JavaScript动态加载 -->
                        <div class="text-center py-5">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">加载中...</span>
                            </div>
                            <p class="mt-2">正在加载通知...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 通知详情模态框 -->
<div class="modal fade" id="notification-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="notification-modal-title">通知详情</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="notification-modal-body">
                <!-- 通知详情内容 -->
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                <button type="button" class="btn btn-primary" id="mark-notification-read">标记为已读</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    $(document).ready(function() {
        let currentNotificationId = null;
        
        // 加载通知
        function loadNotifications() {
            $('#notifications-container').html(`
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">加载中...</span>
                    </div>
                    <p class="mt-2">正在加载通知...</p>
                </div>
            `);
            
            $.ajax({
                url: "{{ url_for('get_notifications') }}",
                type: "GET",
                dataType: "json",
                success: function(response) {
                    if (response.success) {
                        renderNotifications(response.data);
                    } else {
                        $('#notifications-container').html(`
                            <div class="alert alert-danger">
                                <i class="fas fa-exclamation-circle"></i> 加载通知失败: ${response.message}
                            </div>
                        `);
                    }
                },
                error: function() {
                    $('#notifications-container').html(`
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-circle"></i> 加载通知失败，请检查网络连接
                        </div>
                    `);
                }
            });
        }
        
        // 渲染通知列表
        function renderNotifications(notifications) {
            if (notifications.length === 0) {
                $('#notifications-container').html(`
                    <div class="text-center py-5">
                        <i class="fas fa-bell-slash fa-3x text-muted mb-3"></i>
                        <p class="text-muted">暂无通知</p>
                    </div>
                `);
                return;
            }
            
            let html = '';
            notifications.forEach(notification => {
                const typeIcon = getNotificationIcon(notification.type);
                const typeClass = notification.is_read ? 'bg-light' : 'bg-white border-start border-3 border-primary';
                
                html += `
                    <div class="card ${typeClass} mb-3 notification-item" data-id="${notification.id}">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h5 class="card-title">
                                        <i class="${typeIcon}"></i> ${notification.title}
                                        ${!notification.is_read ? '<span class="badge bg-primary ms-2">新</span>' : ''}
                                    </h5>
                                    <p class="card-text">${notification.content}</p>
                                </div>
                                <div class="text-end">
                                    <small class="text-muted d-block">${formatTime(notification.created_at)}</small>
                                    <button class="btn btn-sm btn-outline-primary view-notification mt-2" data-id="${notification.id}">
                                        查看
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            $('#notifications-container').html(html);
        }
        
        // 获取通知图标
        function getNotificationIcon(type) {
            switch(type) {
                case 'message':
                    return 'fas fa-comment';
                case 'file':
                    return 'fas fa-file';
                case 'friend_request':
                    return 'fas fa-user-plus';
                case 'system':
                    return 'fas fa-cog';
                default:
                    return 'fas fa-bell';
            }
        }
        
        // 格式化时间
        function formatTime(timeString) {
            const date = new Date(timeString);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            if (diffMins < 1) {
                return '刚刚';
            } else if (diffMins < 60) {
                return `${diffMins} 分钟前`;
            } else if (diffHours < 24) {
                return `${diffHours} 小时前`;
            } else if (diffDays < 7) {
                return `${diffDays} 天前`;
            } else {
                return date.toLocaleDateString('zh-CN');
            }
        }
        
        // 刷新通知
        $('#refresh-notifications').click(function() {
            loadNotifications();
        });
        
        // 查看通知详情
        $(document).on('click', '.view-notification', function() {
            const notificationId = $(this).data('id');
            currentNotificationId = notificationId;
            
            // 查找通知数据
            $.ajax({
                url: "{{ url_for('get_notifications') }}",
                type: "GET",
                dataType: "json",
                success: function(response) {
                    if (response.success) {
                        const notification = response.data.find(n => n.id == notificationId);
                        if (notification) {
                            $('#notification-modal-title').html(`
                                <i class="${getNotificationIcon(notification.type)}"></i> ${notification.title}
                            `);
                            $('#notification-modal-body').html(`
                                <p>${notification.content}</p>
                                <p class="text-muted small">创建时间: ${new Date(notification.created_at).toLocaleString('zh-CN')}</p>
                            `);
                            $('#notification-modal').modal('show');
                        }
                    }
                }
            });
        });
        
        // 标记单个通知为已读
        $('#mark-notification-read').click(function() {
            if (currentNotificationId) {
                $.ajax({
                    url: "{{ url_for('mark_notification_read') }}",
                    type: "POST",
                    data: {
                        notification_id: currentNotificationId
                    },
                    dataType: "json",
                    success: function(response) {
                        if (response.success) {
                            $('#notification-modal').modal('hide');
                            loadNotifications();
                        } else {
                            alert('标记失败: ' + response.message);
                        }
                    },
                    error: function() {
                        alert('标记失败，请检查网络连接');
                    }
                });
            }
        });
        
        // 全部标记为已读
        $('#mark-all-read').click(function() {
            const unreadNotifications = $('.notification-item').filter(function() {
                return $(this).find('.badge').length > 0;
            });
            
            if (unreadNotifications.length === 0) {
                alert('没有未读通知');
                return;
            }
            
            let processed = 0;
            unreadNotifications.each(function() {
                const notificationId = $(this).data('id');
                
                $.ajax({
                    url: "{{ url_for('mark_notification_read') }}",
                    type: "POST",
                    data: {
                        notification_id: notificationId
                    },
                    dataType: "json",
                    success: function(response) {
                        processed++;
                        if (processed === unreadNotifications.length) {
                            loadNotifications();
                        }
                    }
                });
            });
        });
        
        // 初始加载
        loadNotifications();
        
        // 定时刷新通知（每30秒）
        setInterval(loadNotifications, 30000);
    });
</script>
{% endblock %}
